# Shared tmux config for the macos laptop and the cloud devbox.

# Symlinked to ~/.tmux.conf.
# Machine-specific overrides go in ~/.tmux.local.conf (untracked, see below).

# Change prefix to Ctrl-Space instead of Ctrl-b
unbind C-b
set -g prefix C-Space
bind Space send-prefix

# Split windows using | and -
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# General
set -g mouse on
set -g default-terminal "tmux-256color"
set -g automatic-rename off
set -g allow-rename off

# Exact Catppuccin colors when the outer terminal reports xterm-256color (e.g. over SSH)
set -as terminal-features ",xterm-256color:RGB"

# Copying in tmux (and nvim inside it) lands on the local clipboard, even over SSH (OSC 52)
set -g set-clipboard on

# ── Plugins ─────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'

# ── Catppuccin config ────────────────────────────────────────────────────────
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"

# Show only zoom/bell/activity/silence/mark icons - omits active and last-visited
# indicators since the pill color already distinguishes the selected window
set -g @catppuccin_window_flags_icon_format "##{?window_activity_flag,#{E:@catppuccin_window_flags_icon_activity},}##{?window_bell_flag,#{E:@catppuccin_window_flags_icon_bell},}##{?window_silence_flag,#{E:@catppuccin_window_flags_icon_silent},}##{?window_marked_flag,#{E:@catppuccin_window_flags_icon_mark},}##{?window_zoomed_flag,#{E:@catppuccin_window_flags_icon_zoom},} "

set -g window-status-separator " "

# Load Catppuccin now (TPM loads it again at the end, harmlessly): the status
# lines below expand its segments with -F, and the cpu/battery plugins then fill
# them in. Without this they start empty until the config is re-sourced.
if-shell "test -f ~/.tmux/plugins/tmux/catppuccin.tmux" "run ~/.tmux/plugins/tmux/catppuccin.tmux"

# ── Status bar ───────────────────────────────────────────────────────────────
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# ── Machine-specific (untracked) ─────────────────────────────────────────────
# Laptop: battery plugin + status segment. Devbox: prefix C-a, so it doesn't
# clash with the laptop's C-Space when tmux runs inside tmux over SSH.
source-file -q ~/.tmux.local.conf

# ── Initialize TPM (must be last line) ──────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
